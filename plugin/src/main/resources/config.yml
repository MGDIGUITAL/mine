# ============================================================
# MyLifeCraft Plugin - Configuración Principal
# ============================================================

supabase:
  # URL del proyecto Supabase (sin / al final)
  url: "https://yuesvfqiuxnphrqvwkll.supabase.co"
  # ⚠️ IMPORTANTE: Usar la service_role key (NO la anon key)
  # La service_role key bypasea el RLS y permite leer/escribir libremente.
  # Encuéntrala en: Supabase Dashboard → Project Settings → API → service_role
  service_key: "sb_publishable_cKRie5DwuxAWNx9gpcK8sA_VrdgX3pf"

delivery:
  # Intervalo (segundos) para consultar pedidos pendientes en Supabase
  check_interval_seconds: 30
  # Máximo de intentos antes de marcar la entrega como 'failed'
  max_attempts: 5
  # Notificar al jugador con mensaje en el chat al entregar
  notify_player: true

messages:
  # {product} = nombre del producto, {player} = nick del jugador
  delivery_success: "&a&l✅ &r&f¡Tu compra de &e{product}&f ha sido entregada con éxito!"
  delivery_welcome: "&6&l🎁 &r&fTienes &e{count}&f entrega(s) pendiente(s). ¡Se entregarán ahora!"
  delivery_expired_notify: "&c&l⏰ &r&fTu rango &e{product}&c ha expirado. ¡Renuévalo en la tienda!"
  no_permission: "&c&l✗ &r&cNo tienes permiso para usar este comando."
  reload_success: "&a&l✔ &r&aConfiguración recargada correctamente."
