{% extends "layout.html" %}

{% block content %}
<div class="mylifecraft-container cms-page">
  
  {# CMS Page Header (Título de la página) #}
  <header class="category-hero glass-panel">
    <div class="category-hero-content">
      <h1 class="category-title text-glow">
        <i class="fas fa-file-alt"></i> {{ page.title }}
      </h1>
    </div>
  </header>

  <div class="category-layout">
    {# CMS Main Content (Contenido de texto) #}
    <main class="store-main">
      <div class="store-text text-content glass-panel">
        {{ page.metaData.content|raw }}
      </div>
    </main>

    {# Sidebar #}
    <aside class="store-sidebar">
      {% include "sidebar.twig" %}
    </aside>
  </div>

</div>
{% endblock %}
